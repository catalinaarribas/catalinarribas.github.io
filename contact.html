
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b0b">
<meta name="description" content="Contact Catalina Arribas — Art Direction Portfolio.">

<title>Contact — Catalina Arribas</title>

<style>
:root {
    color-scheme: dark;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #0b0b0b;
    color: #f6f5f2;
    font-family: Arial, Helvetica, sans-serif;
}

a {
    color: inherit;
    text-decoration: none;
}

/* NAVIGATION */

header {
    position: relative;
    z-index: 3;
    background: #0b0b0b;
    width: 100%;
    padding: 30px 4%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
}

.brand {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .16em;
}

nav {
    display: flex;
    flex-wrap: wrap;
    gap: 25px;
}

nav a {
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    transition: opacity .2s;
}

nav a:hover {
    opacity: .55;
}

/* CONTACT HEADER */
/* Same dimensions and positioning as Fiction */

main > section:first-child {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: clamp(360px, 58vh, 720px);
    padding: 100px 6% 75px;
    border-bottom: 1px solid #292929;
    background: #242424 url('assets/contact-header.jpg') center center/cover no-repeat;
}

main > section:first-child::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(
        90deg,
        rgba(0,0,0,.64),
        rgba(0,0,0,.12) 90%
    );
}

.eyebrow {
    position: relative;
    font-size: 11px;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: #f2f2f2;
}

main > section:first-child h1 {
    position: relative;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(48px, 7.2vw, 104px);
    font-weight: 400;
    letter-spacing: -.055em;
    line-height: 1.05;
    margin: 20px 0 0;
    text-shadow: 0 3px 25px rgba(0,0,0,.35);
}

/* CONTACT INFORMATION */

.contact-content {
    padding: 110px 6%;
    min-height: 50vh;
    border-bottom: 1px solid #292929;
}

.contact-intro {
    color: #aaa;
    max-width: 600px;
    line-height: 1.7;
    font-size: 14px;
    margin: 0 0 35px;
}

.contact-details {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 22px;
}

.contact-details a {
    color: #f6f5f2;
    text-decoration: none;
    transition: opacity .2s;
    overflow-wrap: anywhere;
}

.contact-details a:hover {
    opacity: .55;
}

.email {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(25px, 5vw, 70px);
    text-decoration: underline !important;
    text-underline-offset: 9px;
}

.phone {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(21px, 3vw, 38px);
}

/* FOOTER */

footer {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 25px 6%;
    color: #888;
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
}

footer a {
    transition: opacity .2s;
}

footer a:hover {
    opacity: .55;
}

/* MOBILE */

@media (max-width: 700px) {

    header {
        padding: 23px 5%;
        align-items: flex-start;
        flex-direction: column;
        gap: 20px;
    }

    nav {
        gap: 14px;
    }

    nav a {
        font-size: 10px;
    }

    main > section:first-child {
        min-height: 390px;
        padding: 95px 6% 60px;
        background-position: center;
    }

    main > section:first-child h1 {
        font-size: clamp(43px, 10vw, 66px);
    }

    .contact-content {
        padding: 85px 6%;
    }

    footer {
        flex-direction: column;
    }
}

</style>
</head>

<body>

<!-- NAVIGATION -->

<header>

    <a class="brand" href="index.html#home">
        CATALINA ARRIBAS
    </a>

    <nav aria-label="Main navigation">
        <a href="index.html#about">About Me</a>
        <a href="advertising.html">Advertising</a>
        <a href="fiction.html">Fiction</a>
        <a href="music-videos.html">Music Videos</a>
        <a href="contact.html">Contact</a>
    </nav>

</header>


<main>

    <!-- CONTACT HEADER -->

    <section id="contact">

        <span class="eyebrow">04 / Get in touch</span>

        <h1>Contact</h1>

    </section>


    <!-- CONTACT INFORMATION -->

    <section class="contact-content">

        <p class="contact-intro">
            For collaborations, productions and inquiries:
        </p>

        <div class="contact-details">

            <a
                href="mailto:catalinaarribasciordia@gmail.com"
                class="email"
            >
                catalinaarribasciordia@gmail.com
            </a>

            <a
                href="tel:+34638257768"
                class="phone"
            >
                +34 638 257 768
            </a>

        </div>

    </section>

</main>


<!-- FOOTER -->

<footer>

    <span>© 2026 Catalina Arribas</span>

    <span>Art Direction · Madrid</span>

</footer>

</body>
</html>
