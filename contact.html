
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b0b">
<meta name="description" content="Contact Catalina Arribas — Art Direction.">
<title>Catalina Arribas — Contact</title>

<style>
:root {
    color-scheme: dark;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #0b0b0b;
    color: #f2f2f2;
    font-family: Arial, Helvetica, sans-serif;
}

/* NAVIGATION */

header {
    position: relative;
    z-index: 3;
    background: #0b0b0b;
    width: 100%;
    padding: 30px 4%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
}

.brand {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    white-space: nowrap;
}

.brand a {
    color: #f2f2f2;
    text-decoration: none;
}

nav {
    display: flex;
    flex-wrap: wrap;
    gap: 25px;
}

nav a {
    color: #f2f2f2;
    text-decoration: none;
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    transition: opacity .2s;
}

nav a:hover {
    opacity: .5;
}

/* CONTACT HERO */

main > section:first-child {
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: clamp(360px, 58vh, 720px);
    padding: 100px 6% 75px;
    border-bottom: 1px solid #292929;
    background: #242424 url('assets/contact-header.jpg') center center/cover no-repeat;
}

main > section:first-child::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(
        90deg,
        rgba(0,0,0,.64),
        rgba(0,0,0,.12) 90%
    );
}

main > section:first-child h1 {
    margin: 20px 0 0;
    position: relative;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(48px, 7.2vw, 104px);
    font-weight: 400;
    letter-spacing: -.055em;
    line-height: 1.05;
    text-shadow: 0 3px 25px rgba(0,0,0,.35);
}

.eyebrow {
    position: relative;
    color: #f2f2f2;
    font-size: 11px;
    letter-spacing: .25em;
    text-transform: uppercase;
}

/* CONTACT CONTENT */

.contact-content {
    min-height: 50vh;
    padding: 110px 6%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    border-bottom: 1px solid #292929;
}

.contact-intro {
    color: #ff6b00;
    font-size: 14px;
    letter-spacing: .04em;
    margin-bottom: 35px;
}

.contact-details {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
}

.email,
.phone {
    color: #f2f2f2;
    text-decoration: none;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 20px;
    letter-spacing: .08em;
    transition: opacity .2s;
}

.email:hover,
.phone:hover {
    opacity: .5;
}

/* FOOTER */

footer {
    padding: 30px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    color: #888;
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
}

/* MOBILE */

@media (max-width: 700px) {

    header {
        padding: 23px 5%;
        align-items: flex-start;
        flex-direction: column;
        gap: 20px;
    }

    nav {
        gap: 14px;
    }

    nav a {
        font-size: 10px;
    }

    main > section:first-child {
        min-height: 390px;
        padding: 95px 6% 60px;
        background-position: center;
    }

    .contact-content {
        padding: 80px 6%;
    }

    footer {
        padding: 25px 6%;
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
    }
}
</style>
</head>

<body>

<header>
    <div class="brand">
        <a href="index.html">Catalina Arribas</a>
    </div>

    <nav>
        <a href="index.html#about">About</a>
        <a href="advertising.html">Advertising</a>
        <a href="fiction.html">Fiction</a>
        <a href="music-videos.html">Music Videos</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>

    <section class="contact-header">
        <span class="eyebrow">04 / Get in touch</span>
        <h1>Contact</h1>
    </section>

    <section class="contact-content">

        <p class="contact-intro">
            For collaborations, productions and inquiries:
        </p>

        <div class="contact-details">

            <a
                class="email"
                href="mailto:catalinaarribasciordia@gmail.com?subject=Collaboration%20inquiry&body=Hi%20Cata%2C%20you%20are%20exactly%20who%20I%27m%20looking%20for.%20Shall%20we%20work%20together%3F"
            >
                catalinaarribasciordia@gmail.com
            </a>

            <a
                class="phone"
                href="tel:+34638257768"
            >
                +34 638 257 768
            </a>

        </div>

    </section>

</main>

<footer>
    <span>© 2026 Catalina Arribas</span>
    <span>Art Direction · Madrid</span>
</footer>

</body>
</html>
